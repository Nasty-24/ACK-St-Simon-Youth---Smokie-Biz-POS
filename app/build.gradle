plugins {
    id 'com.android.application'
}

android {
    namespace 'co.churchyouth.pos'
    compileSdk 33

    defaultConfig {
        applicationId "co.churchyouth.pos"
        // minSdk 24 = Android 7.0. The Sunmi V2 Pro ships Android 7.1
        // (API 25) — this is the actual floor, not an arbitrary choice.
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Sunmi's built-in printer library. This replaces the old approach of
    // manually copying IWoyouService.aidl / ICallback.aidl into the project:
    // the AAR bundles those interfaces itself and picks the right ones for
    // whatever Sunmi model the app is running on. Resolved from Maven
    // Central, so no extra repository needs declaring.
    //
    // If Gradle sync ever fails to find this, check
    // https://mvnrepository.com/artifact/com.sunmi/printerlibrary for the
    // current version number and bump it here — that's the whole fix.
    implementation 'com.sunmi:printerlibrary:1.0.24'
}
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
